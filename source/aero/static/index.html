<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aero</title>
<link rel="icon" href="icons/aero-bubble-small.svg" type="image/svg+xml">
<link rel="icon" href="icons/aero-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/aero-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/aero-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a8fd8">
<link rel="stylesheet" href="vendor/hljs.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="scene.css">
</head>
<body>
<!-- Frutiger Aero scenery: sky, sun (moon at night), light ribbons, clouds, rolling grass hills, bubbles (added by app.js) -->
<div id="sky" aria-hidden="true">
  <svg class="defs" width="0" height="0" focusable="false">
    <defs>
      <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="cl-top"/><stop offset="1" class="cl-bot"/></linearGradient>
      <linearGradient id="gHill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="h1a"/><stop offset="1" class="h1b"/></linearGradient>
      <linearGradient id="gHill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="h2a"/><stop offset="1" class="h2b"/></linearGradient>
      <linearGradient id="gHill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="h3a"/><stop offset=".55" class="h3b"/><stop offset="1" class="h3c"/></linearGradient>
      <linearGradient id="gRibbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="rb0"/><stop offset=".35" class="rb1"/><stop offset=".65" class="rb2"/><stop offset="1" class="rb0"/></linearGradient>
      <pattern id="pBlades" width="16" height="24" patternUnits="userSpaceOnUse"><path class="blade" d="M3 24 Q4 12 1 2 M8 24 Q9 13 12 4 M13 24 Q13 16 15 10"/></pattern>
      <filter id="fSoft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="fSofter" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
      <symbol id="cloud" viewBox="0 0 260 120">
        <ellipse cx="130" cy="104" rx="112" ry="10" class="cl-shadow"/>
        <g fill="url(#gCloud)"><circle cx="70" cy="70" r="34"/><circle cx="112" cy="50" r="44"/><circle cx="162" cy="58" r="38"/><circle cx="200" cy="76" r="26"/><rect x="40" y="66" width="180" height="38" rx="19"/></g>
        <path d="M84 44 Q112 18 142 36" class="cl-gloss"/>
      </symbol>
    </defs>
  </svg>
  <div class="stars"></div>
  <div class="sun"><div class="rays"></div><div class="disc"></div></div>
  <div class="flare f1"></div><div class="flare f2"></div><div class="flare f3"></div>
  <svg class="ribbons" viewBox="0 0 1600 600" preserveAspectRatio="none" focusable="false">
    <path d="M-80 420 C 300 250, 700 520, 1100 300 S 1600 160, 1700 240" class="r1" filter="url(#fSofter)"/>
    <path d="M-80 380 C 320 230, 720 470, 1120 270 S 1600 150, 1700 210" class="r2" filter="url(#fSoft)"/>
    <path d="M-80 350 C 340 220, 740 430, 1140 250 S 1600 140, 1700 190" class="r3"/>
  </svg>
  <div class="clouds">
    <svg class="cloud c1" viewBox="0 0 260 120"><use href="#cloud"/></svg>
    <svg class="cloud c2" viewBox="0 0 260 120"><use href="#cloud"/></svg>
    <svg class="cloud c3" viewBox="0 0 260 120"><use href="#cloud"/></svg>
    <svg class="cloud c4" viewBox="0 0 260 120"><use href="#cloud"/></svg>
    <svg class="cloud c5" viewBox="0 0 260 120"><use href="#cloud"/></svg>
  </div>
  <svg class="hills" viewBox="0 0 1600 360" preserveAspectRatio="xMidYMax slice" focusable="false">
    <path class="hill far" d="M0 196 C 220 116, 420 106, 640 156 S 1040 226, 1240 146 S 1520 104, 1600 136 L1600 360 L0 360 Z" fill="url(#gHill1)"/>
    <path class="crest" d="M0 196 C 220 116, 420 106, 640 156 S 1040 226, 1240 146 S 1520 104, 1600 136" filter="url(#fSoft)"/>
    <path class="hill mid" d="M0 252 C 260 168, 520 178, 760 228 S 1180 262, 1400 198 S 1560 186, 1600 202 L1600 360 L0 360 Z" fill="url(#gHill2)"/>
    <path class="blades" d="M0 252 C 260 168, 520 178, 760 228 S 1180 262, 1400 198 S 1560 186, 1600 202 L1600 360 L0 360 Z" fill="url(#pBlades)"/>
    <path class="crest" d="M0 252 C 260 168, 520 178, 760 228 S 1180 262, 1400 198 S 1560 186, 1600 202" filter="url(#fSoft)"/>
    <path class="hill front" d="M0 306 C 300 226, 620 250, 900 292 S 1400 304, 1600 262 L1600 360 L0 360 Z" fill="url(#gHill3)"/>
    <path class="blades" d="M0 306 C 300 226, 620 250, 900 292 S 1400 304, 1600 262 L1600 360 L0 360 Z" fill="url(#pBlades)"/>
    <path class="crest strong" d="M0 306 C 300 226, 620 250, 900 292 S 1400 304, 1600 262" filter="url(#fSoft)"/>
    <g class="flowers">
      <g transform="translate(120 318)"><circle r="4"/><circle class="c" r="1.6"/></g><g transform="translate(236 300)"><circle r="3.4"/><circle class="c" r="1.4"/></g>
      <g transform="translate(410 296)"><circle r="4"/><circle class="c" r="1.6"/></g><g transform="translate(530 322)"><circle r="3"/><circle class="c" r="1.2"/></g>
      <g transform="translate(700 318)"><circle r="4.2"/><circle class="c" r="1.7"/></g><g transform="translate(980 330)"><circle r="3.4"/><circle class="c" r="1.4"/></g>
      <g transform="translate(1120 316)"><circle r="4"/><circle class="c" r="1.6"/></g><g transform="translate(1290 324)"><circle r="3.2"/><circle class="c" r="1.3"/></g>
      <g transform="translate(1450 300)"><circle r="4"/><circle class="c" r="1.6"/></g><g transform="translate(1540 322)"><circle r="3.4"/><circle class="c" r="1.4"/></g>
    </g>
  </svg>
</div>
<div id="app">

  <!-- ============ LAUNCHER (model picker) ============ -->
  <section id="launcher" class="view hidden">
    <header class="l-head glass">
      <div class="brand"><img src="icons/aero-bubble.svg" alt=""><span>Aero</span></div>
      <div id="hwChip" class="hw-chip"></div>
      <div class="grow"></div>
      <button class="btn ghost" id="lBack" title="Back to chat">Back to chat</button>
      <button class="icon-btn" id="lSettings" title="Settings"></button>
    </header>
    <div class="l-body">
      <div class="l-col glass">
        <div class="l-section-head">
          <h2>Your models</h2>
          <button class="btn ghost sm" id="browseBtn">Open .gguf file…</button>
        </div>
        <div id="myModels" class="model-list"></div>
      </div>
      <div class="l-col glass">
        <div class="l-section-head"><h2>Find a model on Hugging Face</h2></div>
        <div class="search">
          <span class="search-ico"></span>
          <input id="hfQuery" placeholder="Search GGUF models: qwen3, gemma, llama, deepseek, mistral…" autocomplete="off">
        </div>
        <div id="hfResults" class="hf-results"></div>
      </div>
    </div>
    <div id="repoPanel" class="repo-panel hidden"></div>
  </section>

  <!-- shown while a model drives the mouse, keyboard, an app or the browser -->
  <div id="controlBar" class="control-bar hidden" role="status" aria-live="polite">
    <span class="cb-dot"></span><span class="cb-text" id="controlText"></span>
    <button class="cb-stop" id="controlStop" title="Stop the model now">Stop</button>
  </div>

  <!-- ============ CHAT ============ -->
  <section id="chat" class="view hidden">
    <aside id="sidebar" class="glass">
      <div class="sb-top">
        <div class="brand sm"><img src="icons/aero-bubble.svg" alt=""><span>Aero</span></div>
        <button class="icon-btn" id="sbCollapse" title="Collapse sidebar"></button>
      </div>
      <button class="sb-new btn" id="newChat"><span class="ico-plus"></span><span>New chat</span></button>
      <button class="sb-mem" id="memoryBtn" title="What Aero remembers across chats (facts and lessons)"><span class="ico-mem"></span><span>Memory</span><small id="memCount"></small></button>
      <button class="sb-mem" id="labBtn" title="Profiles, tuning and benchmarks measured on this PC"><span class="ico-lab"></span><span>Performance Lab</span></button>
      <div class="sb-label">Recent</div>
      <div id="chatList" class="chat-list client"></div>
      <div class="sb-bottom">
        <button class="sb-model" id="modelBtn" title="Switch model">
          <span class="dot" id="engineDot"></span>
          <span class="sb-model-text"><b id="modelName">No model</b><small id="modelMeta"></small></span>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings"></button>
      </div>
    </aside>
    <main id="main" class="glass">
      <div class="topbar">
        <button class="icon-btn hidden" id="sbExpand" title="Show sidebar"></button>
        <div class="tb-title" id="chatTitle"></div>
        <span class="agent-chip hidden" id="agentChip"></span>
        <div class="grow"></div>
        <div class="ctx-meter" id="ctxMeter" title="Context used"><div class="ctx-bar"><i></i></div><span></span></div>
        <button class="btn ghost sm hidden" id="compactBtn" title="Save this chat to memory and continue in a fresh chat with an empty context">Compact</button>
        <button class="icon-btn" id="themeBtn" title="Theme: auto / day / night"></button>
        <button class="icon-btn" id="dashBtn" title="Show or hide the live dashboard"></button>
      </div>
      <div class="client main-client">
      <div id="banner" class="banner hidden"></div>
      <div id="loopBar" class="loop-bar hidden"></div>
      <div id="scroller">
        <div id="messages"></div>
        <div id="empty" class="empty"><div class="empty-card">
          <img src="icons/aero-bubble.svg" alt="">
          <p id="emptySub"></p>
          <div class="suggest">
            <button data-s="Take a screenshot and tell me what's on my screen.">Look at my screen</button>
            <button data-s="List the files on my Desktop and summarize what's there.">Tidy my Desktop</button>
            <button data-s="Search the web for today's top tech news and summarize the 5 biggest stories.">Today's tech news</button>
            <button data-s="Check my GPU, CPU and RAM usage right now and tell me if anything looks off.">System check</button>
            <button data-s="Look at my GitHub notifications and open pull requests and summarize what needs my attention.">GitHub catch-up</button>
          </div>
        </div></div>
      </div>
      <div class="composer-wrap">
        <div id="composer" class="composer">
          <div id="chips" class="chips"></div>
          <textarea id="input" rows="1" placeholder="Message Aero…  (paste, drop or attach any file)"></textarea>
          <div class="c-row">
            <button class="icon-btn" id="attachBtn" title="Attach files"></button>
            <button class="pill" id="appBtn" title="Point Aero at an open app window so it can look inside and control it"></button>
            <button class="pill" id="toolsToggle" title="Let the model use tools (files, shell, screen, browser…)"></button>
            <button class="pill" id="thinkToggle" title="Thinking: Auto lets the router decide per request; On / Off force it"></button>
            <button class="pill" id="gptPill" title="ChatGPT finalization: when your local model finishes, GPT-6 Astra checks the work and GPT-6.1 Sol repairs major problems. Runs before Claude when both are on. Off / On / Auto (router decides)"></button>
            <button class="pill" id="reviewPill" title="Claude finalization: when your local model finishes, Claude Fable 5.1 checks the work and Claude Opus 5.5 takes over on major problems. With ChatGPT on too, Claude reviews last and sees ChatGPT's review. Off / On / Auto (router decides)"></button>
            <button class="pill" id="loopPill" title="Forever-loop: repeat this prompt, improving each round, until you press stop"></button>
            <div class="grow"></div>
            <div class="c-end">
              <span class="hint" id="hint"></span>
              <button class="send" id="sendBtn" title="Send (Enter)"></button>
            </div>
          </div>
          <input type="file" id="fileInput" multiple hidden>
        </div>
      </div>
      </div>
    </main>
    <aside id="dash" class="glass"></aside>
  </section>

  <!-- ============ TUNING / LOADING OVERLAY ============ -->
  <div id="loadOverlay" class="overlay hidden">
    <div class="load-card">
      <div class="load-head">
        <div class="spinner" id="loadSpin"></div>
        <div>
          <h3 id="loadTitle">Loading…</h3>
          <p id="loadSub" class="muted"></p>
        </div>
        <div class="grow"></div>
        <button class="btn ghost sm" id="loadCancel">Cancel</button>
      </div>
      <div class="load-meta"><span id="advChip" class="adv-chip hidden"></span><span class="grow"></span><span id="trialCount" class="muted"></span></div>
      <div id="loadProgress" class="progress hidden"><i></i></div>
      <div id="loadLog" class="load-log"></div>
      <table id="trialTable" class="trials hidden">
        <thead><tr><th>#</th><th>Move</th><th>Configuration</th><th>Result</th><th>Prompt</th><th>Generate</th><th>Model mem</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="load-foot hidden" id="loadFoot">
        <button class="btn" id="loadRetry">Retry</button>
        <button class="btn ghost" id="loadClose">Close</button>
      </div>
    </div>
  </div>

  <!-- ============ MODALS ============ -->
  <div id="modal" class="overlay hidden"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3>
    <button class="icon-btn" id="modalClose"></button></div><div id="modalBody" class="modal-body"></div></div></div>

  <div id="dropZone" class="drop hidden"><div>Drop files to attach</div></div>
  <div id="toast" class="toast hidden"></div>
  <div id="tip"></div>
</div>
<script src="vendor/marked.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
<script src="lab.js"></script>
</body>
</html>
