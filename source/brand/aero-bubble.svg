<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Aero app icon, master art (original). One iridescent soap-glass bubble, lit from the upper left.
       Layers, back to front: soft ground shadow, clear blue-cyan body, lower aqua caustic, a calm wave inside,
       iridescent rim, top gloss cap, upper-left specular crescent, secondary reflection. No text. -->
  <defs>
    <radialGradient id="body" cx="0.56" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.38" stop-color="#7fdcfa"/>
      <stop offset="0.72" stop-color="#2a9de6"/>
      <stop offset="0.92" stop-color="#1468c4"/>
      <stop offset="1" stop-color="#0d4f9e"/>
    </radialGradient>
    <radialGradient id="caustic" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9fffb" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#9ff3f0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fe0f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="irid" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#ff8fd6"/>
      <stop offset="0.22" stop-color="#b79bff"/>
      <stop offset="0.45" stop-color="#7fd8ff"/>
      <stop offset="0.66" stop-color="#8affc7"/>
      <stop offset="0.84" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#ff9ccf"/>
    </linearGradient>
    <radialGradient id="rimMask" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.78" stop-color="#000"/>
      <stop offset="0.93" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="rim"><circle cx="256" cy="256" r="216" fill="url(#rimMask)"/></mask>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crescent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#e6fffb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#03264d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#03264d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="ball"><circle cx="256" cy="256" r="216"/></clipPath>
  </defs>
  <ellipse cx="256" cy="486" rx="150" ry="16" fill="url(#shadow)"/>
  <circle cx="256" cy="256" r="216" fill="url(#body)"/>
  <g clip-path="url(#ball)">
    <ellipse cx="262" cy="410" rx="168" ry="86" fill="url(#caustic)"/>
    <path d="M96 318 C150 288 196 290 240 312 C286 334 330 336 418 296" fill="none" stroke="url(#wave)" stroke-width="14" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M128 352 C176 334 214 338 252 352 C292 366 336 366 392 344" fill="none" stroke="url(#wave)" stroke-width="7" stroke-linecap="round" opacity="0.6" filter="url(#soft)"/>
    <circle cx="256" cy="256" r="212" fill="none" stroke="url(#irid)" stroke-width="30" mask="url(#rim)" opacity="0.9" filter="url(#soft)"/>
    <circle cx="256" cy="256" r="214" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  </g>
  <ellipse cx="256" cy="148" rx="150" ry="98" fill="url(#cap)"/>
  <path d="M92 214 C98 140 150 82 222 66 C170 98 132 150 122 214 C118 236 98 238 92 214 Z" fill="url(#crescent)" filter="url(#soft)"/>
  <ellipse cx="370" cy="372" rx="34" ry="16" transform="rotate(-38 370 372)" fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
  <circle cx="394" cy="330" r="7" fill="#ffffff" opacity="0.7"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="#0a3f80" stroke-opacity="0.45" stroke-width="2"/>
</svg>
