# Runs Aero's unit tests on Windows, Linux and macOS for every push and pull request. Live desktop checks
# (tests/test_app_background.py) and real-browser checks need a desktop and are opt-in, so they skip here.
name: CI

on:
  push:
    branches: ["main", "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        working-directory: source
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        working-directory: source
        env:
          AERO_HOME: ${{ runner.temp }}/aero-home
        run: python -m unittest discover -s tests -v

      - name: UI script syntax
        run: node --check source/aero/static/app.js && node --check source/aero/static/lab.js && node --check source/aero/static/scene.js

      - name: Lint (pyflakes and the classic pycodestyle errors)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: source
        run: |
          python -m pip install "ruff>=0.6,<1"
          python -m ruff check aero tests validation --select E9,F63,F7,F82
