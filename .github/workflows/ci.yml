# Runs Aero's unit tests on Windows, Linux and macOS for every push and pull request. Live desktop checks
# (tests/test_app_background.py) and real-browser checks need a desktop and are opt-in, so they skip here.
name: CI

on:
  push:
    branches: ["main", "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        working-directory: source
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        working-directory: source
        env:
          AERO_HOME: ${{ runner.temp }}/aero-home
        run: python -m unittest discover -s tests -v

      - name: UI script syntax
        run: node --check source/aero/static/app.js && node --check source/aero/static/lab.js && node --check source/aero/static/scene.js

      - name: Lint (pyflakes and the classic pycodestyle errors)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: source
        run: |
          python -m pip install "ruff>=0.6,<1"
          python -m ruff check aero tests validation --select E9,F63,F7,F82

  # PK-5 in source/docs/V1.1_TEST_MATRIX.md: a published release (the newest, and 1.0.0), installed into a temp folder,
  # updated in place by this commit's Update-Aero.bat and then by Aero's own updater from a fake release on localhost
  # (one tampered download it must refuse), plus a fresh install of this commit. See validation/check_windows_update.py.
  windows-update:
    strategy:
      fail-fast: false
      matrix:
        previous: [latest, v1.0.0]
    name: windows-update (from ${{ matrix.previous }})
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Previous release
        id: prev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          tag=${{ matrix.previous }}
          [ "$tag" = latest ] && tag=$latest
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -p Aero-windows.zip -p SHA256SUMS.txt -D "$RUNNER_TEMP/previous"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Updating from $tag (newest release: $latest)"

      - name: Build this commit
        shell: bash
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' source/aero/config.py)
          if [ "v$v" = "${{ steps.prev.outputs.latest }}" ]; then
            # same version as the release: give the build its own, so the update can be told apart
            sed -i "s/^VERSION = \".*\"$/VERSION = \"$v-ci.$GITHUB_RUN_NUMBER\"/" source/aero/config.py
          fi
          grep '^VERSION' source/aero/config.py
          python tools/build_release.py --no-deb --no-rpm

      - name: Update the previous release in place
        run: |
          python -m pip install "httpx>=0.27,<1" "psutil>=5.9,<8"
          python source/validation/check_windows_update.py --previous "$env:RUNNER_TEMP\previous\Aero-windows.zip" `
            --previous-sums "$env:RUNNER_TEMP\previous\SHA256SUMS.txt" --candidate dist\Aero-windows.zip `
            --work "$env:RUNNER_TEMP\aero-update" $(if ("${{ matrix.previous }}" -ne "latest") { "--skip-fresh" })

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-logs-${{ matrix.previous }}
          path: |
            ${{ runner.temp }}/aero-update/*.log
            ${{ runner.temp }}/aero-update/results.json
            ${{ runner.temp }}/aero-update/install/data/logs/
            ${{ runner.temp }}/aero-update/fresh/data/logs/
          if-no-files-found: ignore
